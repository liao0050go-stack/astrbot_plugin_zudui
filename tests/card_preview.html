<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    * { box-sizing: border-box; }
    body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 0; padding: 0; width: 560px; display: inline-block;
    }
    .card {
        width: 560px; border-radius: 20px; overflow: hidden;
        background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.12);
    }
    .theme-calm   .banner { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
    .theme-love   .banner { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
    .theme-sweet  .banner { background: linear-gradient(135deg, #f78ca0 0%, #f9748f 100%); }
    .theme-gold   .banner { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
    .theme-single .banner { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    .theme-tea    .banner { background: linear-gradient(135deg, #96e6a1 0%, #43e97b 100%); }
    .banner { padding: 22px 0 18px; text-align: center; color: #fff; }
    .banner .title { font-size: 22px; font-weight: bold; letter-spacing: 6px; }
    .badge {
        display: inline-block; margin-top: 8px; padding: 3px 12px; font-size: 12px;
        background: rgba(255,255,255,.28); border-radius: 10px;
    }
    .couple { display: flex; align-items: center; justify-content: center; padding: 26px 0 10px; }
    .side { width: 180px; text-align: center; }
    .avatar {
        width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
        border: 4px solid #ffd3e0; background: #ffe9f0;
    }
    .name { margin-top: 10px; font-size: 16px; color: #444; font-weight: bold;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heart { font-size: 34px; padding: 0 8px; }
    .rows { padding: 10px 34px 6px; }
    .row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px dashed #ffe4ec; }
    .row:last-child { border-bottom: none; }
    .label { width: 130px; color: #999; font-size: 14px; }
    .value { flex: 1; color: #444; font-size: 15px; font-weight: bold; }
    .bar { flex: 1; height: 12px; background: #ffeef3; border-radius: 6px; overflow: hidden; margin-right: 10px; }
    .bar > div { height: 100%; border-radius: 6px; }
    .theme-calm   .bar > div { background: linear-gradient(90deg, #89f7fe, #66a6ff); }
    .theme-love   .bar > div { background: linear-gradient(90deg, #ff9a9e, #fecfef); }
    .theme-sweet  .bar > div { background: linear-gradient(90deg, #f78ca0, #f9748f); }
    .theme-gold   .bar > div { background: linear-gradient(90deg, #f6d365, #fda085); }
    .theme-single .bar > div { background: linear-gradient(90deg, #a18cd1, #fbc2eb); }
    .theme-tea    .bar > div { background: linear-gradient(90deg, #96e6a1, #43e97b); }
    .footer { padding: 12px 0 18px; text-align: center; color: #c9a0a8; font-size: 12px; }
</style></head><body style="margin:0;background:#eee;display:inline-block"><div style="margin:10px"><div class="card theme-love">
    <div class="banner">
        <div class="title">💍 缘 分 卡 💍</div>
        <div class="badge">🛡 新婚保护中</div>
    </div>
    
    <div class="couple">
        <div class="side">
            <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk=10086&s=640">
            <div class="name">小明</div>
        </div>
        <div class="heart">❤️</div>
        <div class="side">
            <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk=10010&s=640">
            <div class="name">小红</div>
        </div>
    </div>
    
    <div class="rows">
        
        <div class="row">
            <div class="label">好感度</div>
            
            <div class="bar"><div style="width: 37%"></div></div>
            
            <div class="value" style="flex: 0 0 90px; text-align: right;">37/100</div>
        </div>
        
        <div class="row">
            <div class="label">被抢成功率</div>
            
            <div class="value" >54.1%</div>
        </div>
        
        <div class="row">
            <div class="label">在一起</div>
            
            <div class="value" >第 1 天</div>
        </div>
        
        <div class="row">
            <div class="label">被抢次数</div>
            
            <div class="value" >0 次</div>
        </div>
        
    </div>
    <div class="footer">「 愿得一心人，白首不相离 」</div>
</div></div><div style="margin:10px"><div class="card theme-tea">
    <div class="banner">
        <div class="title">🍵 相 亲 卡 🍵</div>
        <div class="badge">⏳ 今日 0 点自动散场</div>
    </div>
    
    <div class="couple">
        <div class="side">
            <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk=12345&s=640">
            <div class="name">阿强</div>
        </div>
        <div class="heart">🍵</div>
        <div class="side">
            <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk=99999&s=640">
            <div class="name">小美</div>
        </div>
    </div>
    
    <div class="rows">
        
        <div class="row">
            <div class="label">关系类型</div>
            
            <div class="value" >相亲 · 临时缘分（不算对象）</div>
        </div>
        
        <div class="row">
            <div class="label">被抢保护</div>
            
            <div class="value" >抢人只认已婚对象，抢不走</div>
        </div>
        
        <div class="row">
            <div class="label">缘分终止</div>
            
            <div class="value" >0 点散场 / 任一方表白脱单 / 跑路</div>
        </div>
        
        <div class="row">
            <div class="label">好感度</div>
            
            <div class="value" >相亲没有好感度</div>
        </div>
        
    </div>
    <div class="footer">「 缘分一日游，且行且珍惜 」</div>
</div></div><div style="margin:10px"><div class="card theme-single">
    <div class="banner">
        <div class="title">🕊 单 身 卡 🕊</div>
        
    </div>
    
    <div class="couple">
        <div class="side">
            <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&nk=99999&s=640">
            <div class="name">小美</div>
        </div>
    </div>
    
    <div class="rows">
        
        <div class="row">
            <div class="label">感情状态</div>
            
            <div class="value" >快乐单身</div>
        </div>
        
        <div class="row">
            <div class="label">今日缘分</div>
            
            <div class="value" >与 阿强 相亲中</div>
        </div>
        
        <div class="row">
            <div class="label">持有羁绊</div>
            
            <div class="value" >—</div>
        </div>
        
        <div class="row">
            <div class="label">今日行动</div>
            
            <div class="value" >剩 1/1 次（抢人/拆散）</div>
        </div>
        
    </div>
    <div class="footer">「 月老最近很忙，暂时排不到你 」</div>
</div></div></body></html>
